<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL BALCONCITO — Rockola</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      /* Paleta OLED + oro */
      --black:#000000;
      --surface:#0a0a0b;
      --surface-2:#141416;
      --line:rgba(255,255,255,.08);
      --line-gold:rgba(255,194,51,.28);
      --gold:#FFC233;
      --gold-2:#F0A500;
      --ink:#F6F4F0;
      --muted:#9C978D;
      --accent-green:#3DDC84;
      --accent-red:#FF6B6B;
      --accent-amber:#FFC233;
      --font-display:'Inter',sans-serif;
      --font-body:'Inter',sans-serif;
      --ease:cubic-bezier(.16,1,.3,1);
      --z-menu:50;
      color-scheme:dark;
    }

    /* ---- Modo claro ---- */
    [data-theme="light"]{
      --black:#F5F4F0;
      --surface:#FFFFFF;
      --surface-2:#F0EDEA;
      --line:rgba(0,0,0,.1);
      --line-gold:rgba(176,120,0,.3);
      --gold:#B07800;
      --gold-2:#8A5C00;
      --ink:#1A1814;
      --muted:#706C62;
      --accent-green:#1E7A47;
      --accent-red:#C0392B;
      --accent-amber:#B07800;
      color-scheme:light;
    }


    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      font-family:var(--font-body);
      background:var(--black);
      color:var(--ink);
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }

    body{padding:2rem 1.25rem 3rem;min-height:100vh;max-width:620px;margin:0 auto}

    /* ---------- Marca ---------- */
    header{text-align:center;padding-bottom:2rem;margin-bottom:2.5rem;position:relative}
    header::after{
      content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
      width:min(100%,520px);height:1px;
      background:linear-gradient(90deg,transparent,var(--line-gold),transparent);
    }

    .brand{
      background:none;-webkit-text-fill-color:initial;
      line-height:0;margin-bottom:1.1rem;
    }

    .brand-logo{
      display:block;width:100%;max-width:400px;height:auto;margin:0 auto;
      filter:drop-shadow(0 8px 28px rgba(255,194,51,.22));
    }

    .subtitle{
      font-size:.72rem;color:var(--muted);font-weight:500;
      text-transform:uppercase;letter-spacing:.28em;
    }

    /* ---------- Formulario ---------- */
    .form-section{margin-bottom:.5rem}

    .form-group{margin-bottom:2rem}

    label{
      display:block;font-size:.7rem;font-weight:600;color:var(--muted);
      text-transform:uppercase;letter-spacing:.16em;margin-bottom:.7rem;
    }

    input[type="text"]{
      width:100%;
      background:var(--surface-2);
      border:1px solid var(--line);
      border-bottom:2px solid rgba(255,194,51,.25);
      border-radius:.6rem;
      padding:1rem 1.1rem;
      color:var(--ink);
      font-family:var(--font-body);font-size:1rem;
      transition:background .3s var(--ease),border-color .3s var(--ease);
    }
    input[type="text"]::placeholder{color:#7a766e}
    input[type="text"]:focus{outline:none;background:#1a1a1d;border-bottom-color:var(--gold)}

    /* ---------- Desplegable de género ---------- */
    .genre-select{position:relative}

    .genre-trigger{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;
      background:var(--surface-2);
      border:1px solid var(--line);
      border-bottom:2px solid rgba(255,194,51,.25);
      border-radius:.6rem;
      padding:1rem 1.1rem;cursor:pointer;
      font-family:var(--font-body);font-size:1rem;color:var(--ink);text-align:left;
      transition:background .3s var(--ease),border-color .3s var(--ease);
    }
    .genre-trigger:hover,
    .genre-select.open .genre-trigger{background:#1a1a1d;border-bottom-color:var(--gold)}
    .genre-trigger:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(255,194,51,.3)}

    .genre-value.empty{color:#7a766e}

    .genre-caret{
      width:10px;height:10px;flex-shrink:0;
      border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);
      transform:rotate(45deg) translateY(-2px);
      transition:transform .3s var(--ease);
    }
    .genre-select.open .genre-caret{transform:rotate(-135deg) translateY(-2px)}

    .genre-menu{
      position:absolute;top:calc(100% + .5rem);left:0;right:0;z-index:var(--z-menu);
      background:#141416;border:1px solid var(--line-gold);border-radius:.7rem;
      padding:.4rem;max-height:17rem;overflow-y:auto;
      box-shadow:0 24px 48px rgba(0,0,0,.75);
      opacity:0;visibility:hidden;transform:translateY(-8px);
      transition:opacity .25s var(--ease),transform .25s var(--ease),visibility .25s;
    }
    .genre-select.open .genre-menu{opacity:1;visibility:visible;transform:translateY(0)}
    .genre-menu::-webkit-scrollbar{width:6px}
    .genre-menu::-webkit-scrollbar-thumb{background:rgba(255,194,51,.3);border-radius:3px}

    .genre-option{
      width:100%;display:flex;align-items:center;justify-content:space-between;
      background:transparent;border:none;border-radius:.4rem;cursor:pointer;
      font-family:var(--font-body);font-size:.9rem;font-weight:500;color:var(--muted);
      padding:.65rem .8rem;text-align:left;
      transition:background .18s var(--ease),color .18s var(--ease);
    }
    .genre-option:hover{background:rgba(255,194,51,.1);color:var(--ink)}
    .genre-option.selected{color:var(--gold);font-weight:700}
    .genre-option.selected::after{content:'\2713';font-size:.85rem}

    /* ---------- Botón principal ---------- */
    button[type="submit"]{
      width:100%;
      font-family:var(--font-display);font-size:1rem;font-weight:700;letter-spacing:.02em;
      background:var(--gold);color:#000;border:none;border-radius:.6rem;
      padding:1.05rem;cursor:pointer;
      transition:background .3s var(--ease),transform .3s var(--ease);
    }
    button[type="submit"]:hover:not(:disabled){background:#fff;transform:translateY(-2px)}
    button[type="submit"]:active{transform:translateY(0)}
    button[type="submit"]:disabled{opacity:.45;cursor:not-allowed;transform:none}

    /* ---------- Mensaje de estado ---------- */
    .status-message{
      margin-top:1rem;padding:0 1rem;border-radius:.5rem;
      font-size:.88rem;font-weight:500;
      max-height:0;opacity:0;overflow:hidden;
      transition:all .35s var(--ease);
    }
    .status-message.success,
    .status-message.error,
    .status-message.info{max-height:8rem;opacity:1;padding:.85rem 1rem}
    .status-message.success{background:rgba(61,220,132,.1);border-left:3px solid var(--accent-green);color:var(--accent-green)}
    .status-message.error{background:rgba(255,107,107,.1);border-left:3px solid var(--accent-red);color:var(--accent-red)}
    .status-message.info{background:rgba(255,194,51,.1);border-left:3px solid var(--gold);color:var(--gold)}

    /* ---------- Contador ---------- */
    .queue-info{
      display:flex;align-items:baseline;justify-content:center;gap:.8rem;
      margin:2.5rem 0;padding:1.5rem 0;
      border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    }
    .queue-count{
      font-family:var(--font-display);font-size:3rem;font-weight:800;
      letter-spacing:-.04em;line-height:.9;color:var(--gold);
    }
    .queue-label{
      font-size:.72rem;color:var(--muted);
      text-transform:uppercase;letter-spacing:.2em;
    }

    /* ---------- Mis canciones ---------- */
    .my-songs-title{
      font-family:var(--font-display);font-size:1.35rem;font-weight:800;
      letter-spacing:-.02em;line-height:1.2;color:var(--ink);
      display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;
    }
    .my-songs-title::before{
      content:'';width:5px;height:1.3rem;background:var(--gold);border-radius:1px;
    }

    .song-card{
      background:var(--surface);
      border:1px solid var(--line);
      border-left:3px solid #3a3833;
      border-radius:0 .6rem .6rem 0;
      padding:1.1rem 1.25rem;margin-bottom:.75rem;
      display:flex;flex-wrap:wrap;gap:1rem;
      align-items:flex-start;justify-content:space-between;
      transition:background .3s var(--ease),transform .3s var(--ease);
    }
    .song-card:hover{background:var(--surface-2);transform:translateX(3px)}
    .song-card.approved{border-left-color:var(--gold)}
    .song-card.playing{border-left-color:var(--accent-green)}
    .song-card.rejected{border-left-color:var(--accent-red);opacity:.5}

    .song-title{
      font-size:1rem;font-weight:700;letter-spacing:-.01em;
      color:var(--ink);margin-bottom:.5rem;word-break:break-word;
    }

    .song-artist{
      display:inline-block;
      font-size:.65rem;font-weight:700;color:var(--gold);
      text-transform:uppercase;letter-spacing:.12em;
      border:1px solid var(--line-gold);border-radius:2rem;
      padding:.2rem .65rem;
    }

    .song-status{
      display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;
      margin-left:auto;text-align:right;
    }

    .status-badge{
      font-size:.62rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.14em;
      color:var(--muted);white-space:nowrap;
    }
    .status-badge.approved{color:var(--gold)}
    .status-badge.playing{color:var(--accent-green)}
    .status-badge.played{color:var(--muted)}
    .status-badge.rejected{color:var(--accent-red)}

    .song-position{
      font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--gold);
    }

    .empty-state{
      text-align:center;padding:2.5rem 1rem;
      color:#5f5b55;font-size:.85rem;
      border:1px dashed var(--line);border-radius:.6rem;
    }

    /* ---------- Pie ---------- */
    footer{
      margin-top:3rem;padding-top:1.5rem;
      border-top:1px solid var(--line);
      text-align:center;font-size:.7rem;color:#5f5b55;
      text-transform:uppercase;letter-spacing:.2em;
    }

    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    @media (max-width:480px){
      body{padding:1.5rem 1rem 2.5rem}
      .brand-logo{max-width:280px}
      .queue-count{font-size:2.5rem}
      .song-card{flex-direction:column}
      .song-status{align-items:flex-start;text-align:left;margin-left:0}
    }

    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.01ms!important;transition-duration:.01ms!important}
    }
  
    /* ---- Toggle tema ---- */
    .theme-toggle{
      position:fixed;top:1rem;right:1rem;z-index:100;
      width:2.5rem;height:2.5rem;
      background:var(--surface-2);
      border:1px solid var(--line);
      border-radius:50%;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;line-height:1;
      transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease);
      box-shadow:0 2px 12px rgba(0,0,0,.25);
    }
    .theme-toggle:hover{transform:scale(1.1);border-color:var(--line-gold)}
    .theme-toggle:active{transform:scale(.95)}

  </style>
</head>

  <!-- ==== BLOQUE ADITIVO KAFEL: toggle claro/oscuro (aislado, no toca lógica original) ==== -->
  <script>
    (function () {
      var KEY = 'kafel-theme';
      var btn = document.getElementById('themeToggle');
      var root = document.documentElement;

      function aplicar(tema) {
        root.setAttribute('data-theme', tema);
        btn.textContent = tema === 'light' ? '\u2600\ufe0f' : '\ud83c\udf19';
        btn.setAttribute('aria-label', tema === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro');
      }

      // Cargar preferencia guardada; si no existe, respetar preferencia del SO
      var guardado = localStorage.getItem(KEY);
      var preferencia = guardado || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      aplicar(preferencia);

      btn.addEventListener('click', function () {
        var actual = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var nuevo  = actual === 'light' ? 'dark' : 'light';
        aplicar(nuevo);
        localStorage.setItem(KEY, nuevo);
      });
    })();
  </script>

  <!-- ==== BLOQUE ADITIVO KAFEL: selector de genero (no toca la logica original) ==== -->
  <script>
    (function () {
      var sel    = document.getElementById('genreSelect');
      var trg    = sel.querySelector('.genre-trigger');
      var val    = sel.querySelector('.genre-value');
      var hidden = document.getElementById('artista');
      var form   = document.getElementById('songForm');
      var msg    = document.getElementById('statusMessage');
      var seleccionado = '';

      function abrir(estado) {
        sel.classList.toggle('open', estado);
        trg.setAttribute('aria-expanded', estado ? 'true' : 'false');
      }

      trg.addEventListener('click', function (e) {
        e.stopPropagation();
        abrir(!sel.classList.contains('open'));
      });

      sel.querySelectorAll('.genre-option').forEach(function (o) {
        o.addEventListener('click', function () {
          sel.querySelectorAll('.genre-option').forEach(function (x) {
            x.classList.remove('selected');
          });
          o.classList.add('selected');
          seleccionado = o.dataset.genero;
          hidden.value = seleccionado;
          val.textContent = seleccionado;
          val.classList.remove('empty');
          abrir(false);
        });
      });

      document.addEventListener('click', function () { abrir(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') abrir(false);
      });

      // Se registra antes que handleSubmit, por lo tanto corre primero.
      form.addEventListener('submit', function (e) {
        if (!seleccionado) {
          e.preventDefault();
          e.stopImmediatePropagation();
          msg.textContent = 'Eleg\u00ed un g\u00e9nero para tu canci\u00f3n';
          msg.className = 'status-message error';
          setTimeout(function () { msg.className = 'status-message'; }, 4000);
          return;
        }
        hidden.value = seleccionado; // re-sincroniza tras cada envio
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Supabase config
    const SUPABASE_URL = 'https://funrnjtplyrzfumqzewo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bnJuanRwbHlyemZ1bXF6ZXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjE3ODUsImV4cCI6MjEwMzkzNzc4NX0.uOGsPepiqgpPYF8oFSozLsPHRIyaoJ9PS69fcOEVkwg';

    let supabaseClient = null;
    let myPlainIds = [];
    let allSongs = [];

    // DOM elements
    const songForm = document.getElementById('songForm');
    const cancionInput = document.getElementById('cancion');
    const artistaInput = document.getElementById('artista');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
    const queueCount = document.getElementById('queueCount');
    const mySongsList = document.getElementById('mySongsList');

    // Initialize Supabase
    function initSupabase() {
      try {
        if (!window.supabase) {
          console.error('Supabase JS no cargó');
          setTimeout(initSupabase, 500);
          return;
        }
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase inicializado');
        loadMyIds();
        fetchSongs();
        songForm.addEventListener('submit', handleSubmit);
      } catch (err) {
        console.error('Error inicializando Supabase:', err);
        setTimeout(initSupabase, 500);
      }
    }

    // Load my IDs from localStorage
    function loadMyIds() {
      const stored = localStorage.getItem('mi_rockola_ids');
      myPlainIds = stored ? JSON.parse(stored) : [];
    }

    // Save my IDs to localStorage
    function saveMyIds() {
      localStorage.setItem('mi_rockola_ids', JSON.stringify(myPlainIds));
    }

    // Show status message
    function showStatus(message, type = 'info') {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;
      setTimeout(() => {
        statusMessage.className = 'status-message';
      }, 4000);
    }

    // Submit song
    async function handleSubmit(e) {
      e.preventDefault();

      const cancion = cancionInput.value.trim();
      const artista = artistaInput.value.trim();

      if (!cancion || !artista) {
        showStatus('Escribí la canción y el artista', 'error');
        return;
      }

      if (!supabaseClient) {
        showStatus('Error: Supabase no está listo', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const { data, error } = await supabaseClient
          .from('solicitudes')
          .insert([
            {
              cancion,
              artista,
              estado: 'pendiente',
              creada_en: new Date().toISOString(),
            },
          ])
          .select();

        if (error) {
          console.error('Error insertando:', error);
          throw error;
        }

        const newId = data[0].id;
        myPlainIds.push(newId);
        saveMyIds();

        showStatus('✅ Dale, la pediste. Esperá que la aprueben', 'success');
        cancionInput.value = '';
        artistaInput.value = '';
        cancionInput.focus();

        fetchSongs();
      } catch (err) {
        console.error('Error:', err);
        if (err.message?.includes('20 inserciones')) {
          showStatus('La cola está muy llena, esperá un toque', 'error');
        } else {
          showStatus('Error al enviar. Probá de nuevo', 'error');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Dale, pídele una';
      }
    }

    // Fetch all songs
    async function fetchSongs() {
      if (!supabaseClient) return;

      try {
        const { data, error } = await supabaseClient
          .from('solicitudes')
          .select('*')
          .in('estado', ['pendiente', 'en_cola', 'sonando', 'sono'])
          .order('creada_en', { ascending: true });

        if (error) {
          console.error('Fetch error:', error);
          return;
        }

        allSongs = data || [];
        renderQueue();
        renderMySongs();
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    // Render queue count
    function renderQueue() {
      const pendingCount = allSongs.filter(s => s.estado === 'pendiente').length;
      queueCount.textContent = pendingCount;
    }

    // Render my songs
    function renderMySongs() {
      const mySongs = allSongs.filter(s => myPlainIds.includes(s.id));

      if (mySongs.length === 0) {
        mySongsList.innerHTML = '<div class="empty-state">Aún no has pedido nada, ¡dale!</div>';
        return;
      }

      mySongsList.innerHTML = '';

      mySongs.forEach((song) => {
        const card = document.createElement('div');
        card.className = `song-card ${song.estado === 'pendiente' ? '' : song.estado === 'en_cola' ? 'approved' : song.estado === 'sonando' ? 'playing' : song.estado === 'sono' ? 'approved' : 'rejected'}`;

        let statusBadge = 'Esperando';
        let position = '';

        if (song.estado === 'pendiente') {
          statusBadge = 'Esperando aprobación';
        } else if (song.estado === 'en_cola') {
          const queuePos = allSongs.filter(
            s => s.estado === 'en_cola' && new Date(s.creada_en) <= new Date(song.creada_en)
          ).length;
          statusBadge = `En cola`;
          position = `#${queuePos}`;
        } else if (song.estado === 'sonando') {
          statusBadge = '🎵 SONANDO AHORA';
        } else if (song.estado === 'sono') {
          statusBadge = 'Ya sonó';
        }

        card.innerHTML = `
          <div>
            <div class="song-title">${escapeHtml(song.cancion)}</div>
            <div class="song-artist">${escapeHtml(song.artista)}</div>
          </div>
          <div class="song-status">
            <span class="status-badge ${song.estado === 'pendiente' ? '' : song.estado === 'en_cola' ? 'approved' : song.estado === 'sonando' ? 'playing' : song.estado === 'sono' ? 'played' : 'rejected'}">
              ${statusBadge}
            </span>
            ${position ? `<span class="song-position">${position}</span>` : ''}
          </div>
        `;

        mySongsList.appendChild(card);
      });
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Poll songs every 2 seconds
    setInterval(fetchSongs, 1000); // Polling cada 1 segundo para actualizaciones en tiempo real

    // Initialize on load
    window.addEventListener('load', initSupabase);
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSupabase);
    } else {
      initSupabase();
    }
  </script>
</body>
</html>
